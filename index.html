<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova AI - Твой помощник</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
        header { background: #1e293b; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .settings-btn { background: none; border: none; color: #38bdf8; font-size: 14px; cursor: pointer; }
        #chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 85%; padding: 12px 16px; border-radius: 16px; line-height: 1.5; font-size: 15px; word-break: break-word; }
        .user { background: #3b82f6; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .ai { background: #334155; color: #f8fafc; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #475569; }
        .input-area { background: #1e293b; padding: 12px; display: flex; gap: 8px; border-top: 1px solid #334155; }
        input[type="text"] { flex: 1; background: #0f172a; border: 1px solid #475569; border-radius: 12px; padding: 12px; color: white; font-size: 16px; outline: none; }
        input[type="text"]:focus { border-color: #38bdf8; }
        button.send-btn { background: #38bdf8; color: #0f172a; border: none; border-radius: 12px; padding: 0 18px; font-weight: bold; cursor: pointer; font-size: 15px; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 16px; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; border: 1px solid #334155; }
        .modal-content h3 { font-size: 18px; }
        .modal-content input { width: 100%; background: #0f172a; border: 1px solid #475569; border-radius: 8px; padding: 10px; color: white; font-size: 14px; outline: none; }
        .modal-content button { background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; padding: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <span>Nova AI ⚡</span>
        <button class="settings-btn" onclick="openSettings()">Ключ API</button>
    </header>

    <div id="chat-container">
        <div class="message ai">Привет, Ислам! Я твоя Nova. Чем зайбёмся сегодня? Задавай вопросы по учебе или проектам! 🚀</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Напиши сообщение..." onkeydown="if(event.key === 'Enter') sendMessage()">
        <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <div id="settings-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3>Введи свой Google AI Studio API-ключ</h3>
            <p style="font-size: 13px; color: #94a3b8;">Ключ сохранится только у тебя на устройстве.</p>
            <input type="password" id="api-key-input" placeholder="AIzaSy...">
            <button onclick="saveApiKey()">Сохранить</button>
        </div>
    </div>

    <script>
        let apiKey = localStorage.getItem('nova_gemini_key') || '';

        function openSettings() {
            document.getElementById('settings-modal').style.display = 'flex';
            document.getElementById('api-key-input').value = apiKey;
        }

        function saveApiKey() {
            apiKey = document.getElementById('api-key-input').value.trim();
            localStorage.setItem('nova_gemini_key', apiKey);
            document.getElementById('settings-modal').style.display = 'none';
            alert('Ключ сохранен!');
        }

        if (!apiKey) {
            setTimeout(openSettings, 500);
        }

        async function sendMessage() {
            const inputField = document.getElementById('user-input');
            const text = inputField.value.trim();
            if (!text) return;

            if (!apiKey) {
                alert('Сначала введи API-ключ в настройках (кнопка вверху справа)!');
                openSettings();
                return;
            }

            const container = document.getElementById('chat-container');
            
            // Сообщение пользователя
            container.innerHTML += `<div class="message user">${escapeHtml(text)}</div>`;
            inputField.value = '';
            container.scrollTop = container.scrollHeight;

            // Ответ-заглушка (печатает...)
            const loadingId = 'loading-' + Date.now();
            container.innerHTML += `<div class="message ai" id="${loadingId}">Думаю...</div>`;
            container.scrollTop = container.scrollHeight;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [
                            {
                                role: "user",
                                parts: [{ text: "Ты — Nova, персональный помощник Ислама. Общайся дружелюбно, помогай по учебе и программированию. Вопрос: " + text }]
                            }
                        ]
                    })
                });

                const data = await response.json();
                const loadingElem = document.getElementById(loadingId);

                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    const aiReply = data.candidates[0].content.parts[0].text;
                    loadingElem.innerHTML = formatText(aiReply);
                } else {
                    loadingElem.innerHTML = 'Ошибка: проверь правильность API-ключа.';
                }
            } catch (error) {
                document.getElementById(loadingId).innerHTML = 'Ошибка соединения с сервером.';
            }
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function formatText(text) {
            return escapeHtml(text).replace(/\n/g, '<br>');
        }
    </script>
</body>
</html>
